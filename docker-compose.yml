services:
  srs:
    image: ossrs/srs:6
    container_name: freetv-srs
    restart: unless-stopped
    command: ["./objs/srs", "-c", "/usr/local/srs/conf/srs.conf"]
    ports:
      - "1935:1935"
      - "8088:8080"
      - "1985:1985"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf:ro

  viewer-counter:
    build:
      context: .
      dockerfile: viewer.Dockerfile
    container_name: freetv-viewer-counter
    restart: unless-stopped
    # No ports exposed — only reachable internally via nginx proxy

  iptv:
    build: .
    container_name: freetv-player
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - srs
      - viewer-counter
